# -------------------------
# Ruff
# -------------------------
[tool.ruff]
line-length = 100

# -------------------------
# Black
# -------------------------
[tool.black]
line-length = 100

# -------------------------
# Pylint
# -------------------------
[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
]

[tool.pylint.design]
max-args = 7
max-attributes = 10
max-locals = 20

[tool.pylint."similarities"]
min-similarity-lines = 5

